  # IPv4 (octet-validated). MUST have :port or /path to qualify as a server IP —
  # this prevents flagging version numbers like "1.21.8.1" or any pure number
  # sequence with dots. URLs starting with http://1.2.3.4 are caught by the URL regex below.
  - "regex:(?<![\\w.])(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)(?:\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)){3}(?::\\d{1,5}|/\\S*)(?![\\w.])"
  # http(s):// URLs
  - "regex:(?<!\\w)https?://\\S+"
  # www. URLs
  - "regex:(?<!\\w)www\\.\\S+"
  # Naked domain (one+ subdomains . TLD), optional :port and /path
  - "regex:(?<![\\w.])(?:[a-zA-Z0-9-]+\\.)+(?:com|net|org|fr|gg|io|club|xyz|tv|live|me|us|co|uk|eu|de|es|it|nl|ru|info|biz|online|shop|app|mc|world|games|gaming|host|sg|pw|cc|cf|ga|tk)(?::\\d{1,5})?(?:/\\S*)?(?!\\w)"
